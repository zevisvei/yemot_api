[project]
name = "yemot-api"
version = "0.1.1"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zevisvei", email = "zszszszs491@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.3",
    "requests>=2.32.5",
]

[project.scripts]
yemot-api = "yemot_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
